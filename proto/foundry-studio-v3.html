<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Foundry Studio v3</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07070a;--s1:#0d0d12;--s2:#111118;--s3:#16161f;--s4:#1c1c26;--s5:#22222e;--b1:#1e1e2a;--b2:#282836;--b3:#323244;--b4:#3e3e52;--tx:#e8e8f0;--t2:#9090aa;--t3:#55556a;--t4:#30303f;--ac:#7b6ef6;--ac2:#9d93ff;--ac3:#c4c0ff;--acb:rgba(123,110,246,.1);--acbd:rgba(123,110,246,.22);--gn:#2dd4bf;--gnb:rgba(45,212,191,.1);--gnbd:rgba(45,212,191,.22);--yw:#f59e0b;--ywb:rgba(245,158,11,.1);--ywbd:rgba(245,158,11,.22);--rd:#f87171;--rdb:rgba(248,113,113,.1);--rdbd:rgba(248,113,113,.22);--bl:#60a5fa;--blb:rgba(96,165,250,.1);--blbd:rgba(96,165,250,.22);--pu:#a78bfa;--pub:rgba(167,139,250,.1);--pubd:rgba(167,139,250,.22);--r:6px;--mono:'Geist Mono',monospace;--sans:'Geist',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);color:var(--tx);font-size:13px;line-height:1.5;display:flex;flex-direction:column}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b3);border-radius:99px}

.topbar{height:40px;min-height:40px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 12px;gap:10px;z-index:200;user-select:none}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--ac2)}
.logo-mark{width:24px;height:24px;background:linear-gradient(135deg,#5b4cf0,#7c6dfa);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.tb-sep{width:1px;height:16px;background:var(--b2)}
.tb-crumb{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px}
.tb-crumb strong{color:var(--tx);font-weight:500}
.tb-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px}
.b-local{background:var(--gnb);color:var(--gn);border:1px solid var(--gnbd)}
.b-phase{background:var(--acb);color:var(--ac2);border:1px solid var(--acbd)}
.tb-sp{flex:1}
.tb-cmd{font-family:var(--mono);font-size:11px;color:var(--t3);background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.12s}
.tb-cmd:hover{color:var(--t2);border-color:var(--b3)}
.tb-cmd kbd{font-family:var(--mono);font-size:10px;background:var(--s3);border:1px solid var(--b3);border-radius:3px;padding:1px 5px;color:var(--t3)}
.tb-icon{width:30px;height:30px;background:none;border:1px solid var(--b2);border-radius:var(--r);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.12s;position:relative}
.tb-icon:hover{background:var(--s2);border-color:var(--b3);color:var(--tx)}
.notif-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--rd);border:1.5px solid var(--s1)}

.workspace{flex:1;display:flex;overflow:hidden}

.rail{width:46px;min-width:46px;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.r-btn{width:34px;height:34px;border-radius:var(--r);border:none;background:none;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.1s;position:relative}
.r-btn:hover{background:var(--s3);color:var(--t2)}.r-btn.active{background:var(--acb);color:var(--ac2)}
.r-tip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--s4);border:1px solid var(--b3);border-radius:var(--r);padding:4px 9px;font-size:11px;color:var(--tx);white-space:nowrap;pointer-events:none;z-index:300;display:none}
.r-btn:hover .r-tip{display:block}
.r-sp{flex:1}

.sidebar{width:214px;min-width:214px;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:10px 12px 8px;border-bottom:1px solid var(--b1)}
.sb-title{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:7px}
.sb-search{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:5px 9px;font-family:var(--sans);font-size:12px;color:var(--tx);outline:none;transition:.12s}
.sb-search:focus{border-color:var(--ac)}.sb-search::placeholder{color:var(--t4)}
.sb-counts{display:flex;gap:5px;margin-top:7px}
.sb-count{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:5px;padding:5px 6px;text-align:center}
.sb-count-n{font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.1}
.sb-count-l{font-size:9px;color:var(--t3);margin-top:1px}
.sb-body{flex:1;overflow-y:auto;padding:4px 0 12px}
.dg-header{padding:8px 12px 3px;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:6px}
.dg-header::after{content:'';flex:1;height:1px;background:var(--b1)}
.nr{padding:5px 12px;display:flex;align-items:center;gap:7px;cursor:pointer;border-left:2px solid transparent;transition:.08s}
.nr:hover{background:var(--s2)}.nr.sel{background:var(--acb);border-left-color:var(--ac)}.nr.tr{background:rgba(245,158,11,.06);border-left-color:var(--yw)}
.ni{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:7px;font-weight:600;border-radius:3px}
.ni-resource{background:var(--blb);color:var(--bl)}.ni-transfer{background:var(--gnb);color:var(--gn)}.ni-rule{background:var(--ywb);color:var(--yw)}.ni-reactor{background:var(--pub);color:var(--pu)}
.nlabel{font-size:11px;color:var(--tx);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spip{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pip-gap{background:var(--yw)}.pip-sens{background:var(--rd)}.pip-ok{background:var(--gn)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

.lensbar{height:38px;min-height:38px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 14px;gap:4px}
.lb{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:500;color:var(--t3);cursor:pointer;border:1px solid transparent;transition:.1s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.lb:hover{color:var(--t2);background:var(--s2)}
.lb.active{color:var(--tx);background:var(--s3);border-color:var(--b3)}
.lb.active.l-str{color:var(--ac2);border-color:var(--acbd)}
.lb.active.l-cmp{color:var(--yw);border-color:var(--ywbd)}
.lb.active.l-sen{color:var(--rd);border-color:var(--rdbd)}
.lb.active.l-hlth{color:var(--gn);border-color:var(--gnbd)}
.lb.active.l-trc{color:var(--yw);border-color:var(--ywbd);background:rgba(245,158,11,.06)}
.lb.active.l-imp{color:var(--bl);border-color:var(--blbd)}
.lb.active.l-erd{color:var(--pu);border-color:var(--pubd)}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.lb-sep{width:1px;height:18px;background:var(--b2);margin:0 4px}
.lb-sp{flex:1}

.trace-bar{display:none;padding:8px 14px;background:rgba(245,158,11,.05);border-bottom:1px solid rgba(245,158,11,.15);align-items:center;gap:10px;flex-shrink:0}
.trace-bar.on{display:flex}
.tbar-title{font-size:11px;color:var(--yw);font-weight:600}
.tsc-sel{background:var(--s2);border:1px solid var(--b3);border-radius:var(--r);padding:4px 8px;font-family:var(--mono);font-size:10px;color:var(--tx);outline:none;cursor:pointer}
.tsc-sel option{background:var(--s3)}
.tpath{flex:1;font-family:var(--mono);font-size:10px;color:var(--t2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tnode{padding:2px 7px;background:var(--ywb);border:1px solid var(--ywbd);border-radius:3px;color:var(--yw);cursor:pointer;transition:.1s}
.tnode:hover{background:rgba(245,158,11,.18)}
.tarr{color:var(--t4)}
.tinfo{font-size:10px;color:var(--t3);font-family:var(--mono)}
.tcls{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:2px;transition:.1s}
.tcls:hover{color:var(--t2)}

.cw{flex:1;display:flex;overflow:hidden}
.canvas{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.cgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(30,30,42,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(30,30,42,.7) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.cgrad{position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 35% 45%,rgba(123,110,246,.035) 0%,transparent 65%),radial-gradient(ellipse 35% 55% at 70% 30%,rgba(45,212,191,.02) 0%,transparent 60%);pointer-events:none}
#gsvg{width:100%;height:100%;overflow:visible;position:absolute;top:0;left:0}

.hcard{position:absolute;pointer-events:none;z-index:100;background:var(--s2);border:1px solid var(--b3);border-radius:8px;padding:10px 12px;min-width:200px;max-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;transition:opacity .1s}
.hc-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.hc-name{font-size:12px;font-weight:600;color:var(--tx)}
.hc-type{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:3px;border:1px solid}
.hc-rows{display:flex;flex-direction:column;gap:3px}
.hc-row{display:flex;align-items:center;gap:6px;font-size:10px}
.hc-k{font-family:var(--mono);font-size:9px;color:var(--t3);width:66px;flex-shrink:0}
.hc-v{font-family:var(--mono);font-size:9px;color:var(--tx)}
.hc-v.ok{color:var(--gn)}.hc-v.warn{color:var(--yw)}.hc-v.err{color:var(--rd)}.hc-v.ac{color:var(--ac2)}
.hc-div{height:1px;background:var(--b2);margin:5px 0}
.hc-cbar{display:flex;align-items:center;gap:6px;flex:1}
.hc-cbg{flex:1;height:3px;background:var(--s5);border-radius:99px;overflow:hidden}
.hc-cfill{height:100%;border-radius:99px}
.hc-req{display:inline-flex;font-family:var(--mono);font-size:8px;padding:1px 4px;border-radius:2px;border:1px solid;margin:1px}
.hc-req.ok{background:var(--gnb);color:var(--gn);border-color:var(--gnbd)}
.hc-req.gap{background:var(--ywb);color:var(--yw);border-color:var(--ywbd)}

.drawer{width:0;min-width:0;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;transition:width .2s,min-width .2s;flex-shrink:0}
.drawer.open{width:360px;min-width:360px}
.dtabs{display:flex;border-bottom:1px solid var(--b1);flex-shrink:0}
.dtab{flex:1;padding:8px 0;text-align:center;font-size:11px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:.1s}
.dtab:hover{color:var(--t2)}.dtab.active{color:var(--tx);border-bottom-color:var(--ac)}
.dbody{flex:1;overflow-y:auto}
.dclose-row{display:flex;justify-content:flex-end;padding:8px 12px 0}
.dclose{background:none;border:none;color:var(--t3);cursor:pointer;font-size:12px;padding:3px 6px;border-radius:3px;transition:.1s}
.dclose:hover{background:var(--s3);color:var(--t2)}
.ds{padding:10px 14px;border-bottom:1px solid var(--b1)}
.ds-lbl{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.ds-cnt{font-family:var(--mono);font-size:9px;background:var(--s3);padding:0 4px;border-radius:2px;color:var(--t2)}
.d-mod{font-family:var(--mono);font-size:9px;color:var(--t3);margin-bottom:3px}
.d-name{font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.01em}
.d-desc{font-size:11px;color:var(--t2);line-height:1.65;margin-top:6px}
.d-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;border:1px solid}
.t-dom{background:var(--acb);color:var(--ac2);border-color:var(--acbd)}
.t-sen{background:var(--rdb);color:var(--rd);border-color:var(--rdbd)}
.t-gap{background:var(--ywb);color:var(--yw);border-color:var(--ywbd)}
.t-ok{background:var(--gnb);color:var(--gn);border-color:var(--gnbd)}
.t-n{background:var(--s3);color:var(--t2);border-color:var(--b3)}
.d-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.d-mpill{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--b2);border-radius:4px;padding:3px 8px;font-size:10px;color:var(--t2)}
.d-mpill span{font-family:var(--mono);font-size:9px}
.atbl{width:100%;border-collapse:collapse}
.atbl tr{border-bottom:1px solid var(--b1)}.atbl tr:last-child{border-bottom:none}
.atbl td{padding:4px 0;vertical-align:top}
.aname{font-family:var(--mono);font-size:10px;color:var(--tx);font-weight:500}
.atype{font-family:var(--mono);font-size:9px;background:var(--blb);color:var(--bl);padding:1px 4px;border-radius:2px}
.adesc{font-size:10px;color:var(--t3);line-height:1.4;margin-top:1px}
.aflag{font-family:var(--mono);font-size:8px;padding:1px 3px;border-radius:2px;margin-left:3px}
.f-pii{background:var(--rdb);color:var(--rd)}.f-mon{background:var(--gnb);color:var(--gn)}
.arow{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid var(--b1)}.arow:last-child{border-bottom:none}
.aname2{font-family:var(--mono);font-size:10px;color:var(--tx);flex:1}
.cbadge{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:3px;border:1px solid}
.c-str{background:var(--blb);color:var(--bl);border-color:var(--blbd)}.c-beh{background:var(--pub);color:var(--pu);border-color:var(--pubd)}
.c-sen{background:var(--rdb);color:var(--rd);border-color:var(--rdbd)}.c-cmp{background:var(--ywb);color:var(--yw);border-color:var(--ywbd)}
.ritem{display:flex;align-items:center;gap:7px;padding:5px 8px;background:var(--s2);border:1px solid var(--b1);border-radius:5px;margin-bottom:4px;cursor:pointer;transition:.1s}
.ritem:hover{border-color:var(--b3)}
.rid{font-family:var(--mono);font-size:10px;color:var(--ac2);width:80px;flex-shrink:0}
.rlbl{font-size:10px;color:var(--t2);flex:1;line-height:1.3}
.rchip{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:3px}
.rc-ok{background:var(--gnb);color:var(--gn)}.rc-gap{background:var(--ywb);color:var(--yw)}
.covwrap{background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:9px 11px}
.covrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.covlbl{font-size:10px;color:var(--t2);width:52px}
.covbg{flex:1;height:4px;background:var(--s5);border-radius:99px;overflow:hidden}
.covfill{height:100%;border-radius:99px;transition:width .4s}
.covpct{font-family:var(--mono);font-size:10px;width:30px;text-align:right}
.tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:2px}
.tc{background:var(--s3);border:1px solid var(--b2);border-radius:4px;padding:6px 4px;text-align:center}
.tc-ic{font-size:13px;line-height:1}.tc-lb{font-size:9px;color:var(--t3);margin-top:2px}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.icell{background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:5px 8px;display:flex;align-items:center;gap:6px}
.ikey{font-size:10px;color:var(--t2);flex:1}
.iv{font-family:var(--mono);font-size:9px}
.iv-ok{color:var(--gn)}.iv-no{color:var(--t4)}.iv-w{color:var(--yw)}.iv-bl{color:var(--bl);font-size:8px}
.smst{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;background:var(--s3);border:1px solid var(--b2);color:var(--t2)}
.smtr{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t2);padding:2px 0}
.smarr{color:var(--t4)}
.telem{font-family:var(--mono);font-size:10px;background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:5px 8px;display:inline-flex}
.tsep{color:var(--t4);margin:0 2px}.tp{color:var(--ac2)}
.mrow{font-family:var(--mono);font-size:10px;padding:3px 0;display:flex;gap:8px;border-bottom:1px solid var(--b1);color:var(--t2)}.mrow:last-child{border-bottom:none}
.mn{color:var(--gn);width:64px}.mtyp{flex:1}.mcldr{color:var(--t3)}
.flow-intro{font-size:11px;color:var(--t2);line-height:1.6;margin-bottom:10px}
.fstep{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;background:var(--s2);border:1px solid var(--b1);border-radius:5px;margin-bottom:4px;cursor:pointer;transition:.1s}
.fstep:hover{border-color:var(--b3)}.fstep.act{background:rgba(245,158,11,.06);border-color:var(--ywbd)}
.fsnum{width:20px;height:20px;border-radius:50%;background:var(--s3);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--t2);flex-shrink:0;margin-top:1px}
.fsnum.act{background:var(--ywb);border-color:var(--ywbd);color:var(--yw)}
.fsbody{flex:1}.fstitle{font-size:11px;font-weight:600;color:var(--tx)}.fssub{font-size:10px;color:var(--t3);margin-top:2px;line-height:1.4}
.fst{font-family:var(--mono);font-size:8px;padding:1px 4px;border-radius:2px;margin-left:5px}
.fst-ok{background:var(--gnb);color:var(--gn)}.fst-gap{background:var(--ywb);color:var(--yw)}
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.scbtn{background:var(--s2);border:1px solid var(--b2);border-radius:5px;padding:6px 8px;font-size:10px;color:var(--t2);cursor:pointer;text-align:left;transition:.1s;line-height:1.4}
.scbtn:hover{border-color:var(--b3);color:var(--tx)}
.dcta{padding:10px 14px 14px;border-top:1px solid var(--b1);flex-shrink:0;display:none;flex-direction:column;gap:5px}
.dcta.on{display:flex}
.btn-p{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 12px;background:var(--ac);border:none;border-radius:var(--r);font-family:var(--sans);font-size:12px;font-weight:500;color:#fff;cursor:pointer;width:100%;transition:.12s}
.btn-p:hover{background:var(--ac2)}
.btn-g{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 12px;background:none;border:1px solid var(--b3);border-radius:var(--r);font-family:var(--sans);font-size:12px;color:var(--t2);cursor:pointer;width:100%;transition:.12s}
.btn-g:hover{border-color:var(--b4);color:var(--tx)}
.btn-t{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 12px;background:rgba(245,158,11,.08);border:1px solid var(--ywbd);border-radius:var(--r);font-family:var(--sans);font-size:12px;color:var(--yw);cursor:pointer;width:100%;transition:.12s}
.btn-t:hover{background:rgba(245,158,11,.14)}

.feed{width:0;min-width:0;background:var(--s1);border-left:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;transition:width .2s,min-width .2s;flex-shrink:0}
.feed.open{width:320px;min-width:320px}

<div class="topbar">
  <div class="logo"><div class="logo-mark">F</div>FOUNDRY</div>
  <div class="tb-sep"></div>
  <div class="tb-crumb"><strong>igaming-platform</strong><span class="tb-badge b-local">local</span><span class="tb-badge b-phase">Phase 2</span></div>
  <div class="tb-sep"></div>
  <div class="tb-crumb" style="font-size:10px;font-family:var(--mono)">synced <span style="color:var(--t2)">18s ago</span></div>
  <div class="tb-sp"></div>
  <button class="tb-cmd" onclick="openPal()">Jump to… <kbd>⌘K</kbd></button>

</div>

<div class="workspace">

  <button class="r-btn" onclick="showToast('Test coverage — Phase 4')">✦<span class="r-tip">Test Coverage</span></button>

      <option value="deposit">Player deposits via card</option>
      <option value="register">New player registration</option>
      <option value="play">Player initiates game round</option>

    <div class="tpath" id="tpath"><span style="color:var(--t4);font-size:10px">Select a scenario above</span></div>
    <div class="tinfo" id="tinfo"></div>
    <button class="tcls" onclick="clearTrace()">✕</button>
  </div>

  <div class="cw">
    <div class="drawer" id="drawer">
      <div class="dtabs">
        <div class="dtab active" id="dt-details" onclick="switchDTab('details')">Details</div>
        <div class="dtab" id="dt-flow" onclick="switchDTab('flow')">Flow</div>
        <div class="dtab" id="dt-shortcuts" onclick="switchDTab('shortcuts')">Actions</div>
      </div>
      <div class="dbody" id="dbody">

        <div id="dcontent"></div>
      </div>
      <div class="dcta" id="dcta"></div>

      <div class="cgrad"></div>
      <svg id="gsvg"></svg>

      <div id="canvas-legend"></div>
    </div>

    <div class="feed open" id="feed">
      <div class="feed-head">

        <span style="font-family:var(--mono);font-size:9px;color:var(--t4)">⌘\</span>

      </div>
      <div class="feed-tabs">
        <div class="feed-tab active" onclick="switchFT(this)">Feed</div>

      </div>
      <div class="feed-stream" id="fstream"></div>
      <div class="finput-wrap">

      </div>
    </div>
  </div>
</div>
</div>

<div class="bsback" id="bsback" onclick="closeBs()"></div>

  <div class="bs-body" id="bsbody"></div>
  <div class="bs-foot">

</div>

// ─── NODE SHAPE PATHS ────────────────────────────────────────────────────────
// Returns {outline, clip} SVG path strings for each node type.
// Resource  → rounded rectangle (standard)
// Transfer  → parallelogram (skewed right, implies flow/movement)
// Rule      → hexagon (implies protection/constraint)
// Reactor   → rounded diamond (implies async transformation)
function nodeShape(type,x,y,W,H){
  if(type==='transfer'){
    // parallelogram: skew top-right 10px
    const sk=10;
    return `M${x+sk},${y} L${x+W},${y} L${x+W-sk},${y+H} L${x},${y+H} Z`;
  }
  if(type==='rule'){
    // shield hexagon: flat top/bottom, angled sides
    const mx=x+W/2,r=6;
    return `M${mx},${y} L${x+W-r},${y+10} L${x+W-r},${y+H-10} L${mx},${y+H} L${x+r},${y+H-10} L${x+r},${y+10} Z`;
  }
  if(type==='reactor'){
    // rounded diamond: diamond with soft corners via cubic bezier
    const mx=x+W/2,my=y+H/2,t=8;
    return `M${mx},${y} C${mx+t},${y} ${x+W},${my-t} ${x+W},${my} C${x+W},${my+t} ${mx+t},${y+H} ${mx},${y+H} C${mx-t},${y+H} ${x},${my+t} ${x},${my} C${x},${my-t} ${mx-t},${y} ${mx},${y} Z`;
  }
  // resource: rounded rect (rx=6)
  const r=6;
  return `M${x+r},${y} L${x+W-r},${y} Q${x+W},${y} ${x+W},${y+r} L${x+W},${y+H-r} Q${x+W},${y+H} ${x+W-r},${y+H} L${x+r},${y+H} Q${x},${y+H} ${x},${y+H-r} L${x},${y+r} Q${x},${y} ${x+r},${y} Z`;
}

function buildNode(n,p){
  const NW=148,NH=58,tc=TC[n.type];
  const isSel=sel===n.id,isTrc=traceSet.has(n.id),isGapTrc=traceGaps.has(n.id);
  let op=1;
  if(lens==='cmp')op=n.reqs.length?1:.22;
  else if(lens==='sen')op=n.sensitive?1:.18;
  else if(lens==='trc'&&traceId)op=isTrc?1:.15;
  else if(lens==='imp')op=impNode?(n.id===impNode||impSet.has(n.id)?1:.15):.7;
  else if(lens==='erd')op=n.attrs&&n.attrs.length?1:.3;
  const filt=isSel?'filter="url(#gsel)"':isTrc&&!isSel?'filter="url(#gtrc)"':'';

  // border: dashed for compliance gap, solid otherwise
  const isCompGap=n.gap;
  const strokeDash=isCompGap&&lens!=='trc'?'stroke-dasharray="5,3"':'';
  let strokeC=isSel?'#9d93ff':isGapTrc?'#f59e0b':isTrc?'rgba(245,158,11,.6)':
    lens==='cmp'&&n.gap?'rgba(245,158,11,.7)':
    lens==='sen'&&n.sensitive?'rgba(248,113,113,.6)':'rgba(40,40,60,.9)';
  let strokeW=isSel?2.5:isGapTrc||isTrc?2:1.5;

  // node fill — coverage-tinted in hlth lens, compliance tint in cmp lens
  // In structure/ambient: subtle coverage fill gradient on node body
  const covR=n.cov/100;
  const covCol=n.cov>=80?'45,212,191':n.cov>=50?'245,158,11':'248,113,113';
  let fill='#111118';
  if(lens==='hlth'){fill=`rgba(${covCol},${.03+covR*.12})`;}
  else if(lens==='cmp'){fill=n.gap?'rgba(245,158,11,.05)':n.reqs.length?'rgba(45,212,191,.04)':fill;}
  else if(lens==='imp'){
    if(n.id===impNode)fill='rgba(96,165,250,.08)';
    else if(impSet.has(n.id))fill='rgba(96,165,250,.04)';
  }
  else if(lens==='erd'){
    fill=n.attrs&&n.attrs.length?'rgba(167,139,250,.06)':'#111118';
  }
  else if(lens==='str'||lens==='trc'){
    // ambient: faint coverage fill so structure lens already encodes health
    fill=`rgba(${covCol},${.015+covR*.04})`;
  }

  // shape path
  const shapePath=nodeShape(n.type,p.x,p.y,NW,NH);

  // coverage fill bar — inside the shape, bottom strip
  const covW=Math.round(covR*(NW-16));
  const cc2=n.cov>=80?'#2dd4bf':n.cov>=50?'#f59e0b':'#f87171';

  // status ring (3-arc quarter-circle at top-right corner)
  const rx=p.x+NW-2,ry=p.y+2,R=10;
  const compC=!n.reqs.length?'rgba(40,40,60,.6)':n.gap?'#f59e0b':'#2dd4bf';
  const hlthC=n.cov>=80?'#2dd4bf':n.cov>=50?'#f59e0b':'#f87171';
  const opC=n.pm?'#60a5fa':n.oban.length?'#a78bfa':'rgba(40,40,60,.6)';
  // arc 1: compliance (top, 270°→315°)
  const a1x1=rx+R*Math.cos(Math.PI*1.5),a1y1=ry+R*Math.sin(Math.PI*1.5);
  const a1x2=rx+R*Math.cos(Math.PI*1.75),a1y2=ry+R*Math.sin(Math.PI*1.75);
  // arc 2: health (315°→360°/0°)
  const a2x2=rx+R,a2y2=ry;
  // arc 3: operational (0°→45°)
  const a3x2=rx+R*Math.cos(Math.PI*.25),a3y2=ry+R*Math.sin(Math.PI*.25);
  const ring=`
    <path d="M${a1x1},${a1y1} A${R},${R} 0 0,1 ${a1x2},${a1y2}" fill="none" stroke="${compC}" stroke-width="2.5" stroke-linecap="round" opacity="${op}"/>
    <path d="M${a1x2},${a1y2} A${R},${R} 0 0,1 ${a2x2},${a2y2}" fill="none" stroke="${hlthC}" stroke-width="2.5" stroke-linecap="round" opacity="${op}"/>
    <path d="M${a2x2},${a2y2} A${R},${R} 0 0,1 ${a3x2},${a3y2}" fill="none" stroke="${opC}" stroke-width="2.5" stroke-linecap="round" opacity="${op}"/>`;

  // sensitive dot (top-left red pip)
  const sdot=n.sensitive?`<circle cx="${p.x+8}" cy="${p.y+8}" r="3.5" fill="rgba(248,113,113,.8)" opacity="${op}"/>`:'';

  // type icon label (top-left, after stripe)
  const typeX=n.sensitive?p.x+18:p.x+10;

  // infra micro-badges row
  let badges='',bx=p.x+8;const by=p.y+NH-14;
  if(n.oban.length){badges+=`<rect x="${bx}" y="${by}" width="24" height="10" rx="2" fill="rgba(167,139,250,.12)" stroke="rgba(167,139,250,.25)" stroke-width=".7" opacity="${op}"/><text x="${bx+4}" y="${by+8}" font-family="Geist Mono,monospace" font-size="6.5" fill="#a78bfa" opacity="${op}">oban</text>`;bx+=28;}
  if(n.sm.on){badges+=`<rect x="${bx}" y="${by}" width="20" height="10" rx="2" fill="rgba(96,165,250,.1)" stroke="rgba(96,165,250,.22)" stroke-width=".7" opacity="${op}"/><text x="${bx+4}" y="${by+8}" font-family="Geist Mono,monospace" font-size="6.5" fill="#60a5fa" opacity="${op}">fsm</text>`;bx+=24;}
  if(n.pm){badges+=`<rect x="${bx}" y="${by}" width="30" height="10" rx="2" fill="rgba(96,165,250,.1)" stroke="rgba(96,165,250,.3)" stroke-width=".7" opacity="${op}"/><text x="${bx+4}" y="${by+8}" font-family="Geist Mono,monospace" font-size="6.5" fill="#60a5fa" opacity="${op}">migr⚠</text>`;bx+=34;}
  if(n.rl){badges+=`<rect x="${bx}" y="${by}" width="26" height="10" rx="2" fill="rgba(245,158,11,.08)" stroke="rgba(245,158,11,.2)" stroke-width=".7" opacity="${op}"/><text x="${bx+4}" y="${by+8}" font-family="Geist Mono,monospace" font-size="6.5" fill="#f59e0b" opacity="${op}">rate</text>`;}

  // req pill (first req, top-right area below ring)
  const req1=n.reqs[0]?`<text x="${p.x+NW-4}" y="${p.y+28}" font-family="Geist Mono,monospace" font-size="7" fill="${n.gap?'rgba(245,158,11,.7)':'rgba(123,110,246,.6)'}" text-anchor="end" opacity="${op}">${n.reqs[0]}</text>`:'';

  const nm=n.name.length>16?n.name.substring(0,15)+'…':n.name;

  // left type stripe
  const stripe=`<rect x="${p.x}" y="${p.y}" width="3.5" height="${NH}" rx="1.5" fill="${tc}" opacity="${op*.9}"/>`;

  // ERD lens: expand node to show attribute rows
  let erdOverlay='',erdH=0;
  if(lens==='erd'&&n.attrs&&n.attrs.length){
    erdH=n.attrs.length*12+8;
    let rows='';
    n.attrs.forEach((a,i)=>{
      const ay=p.y+NH+4+i*12;
      const piiMark=a.pii?`<tspan fill="#f87171" font-size="7"> PII</tspan>`:'';
      const monMark=a.mon?`<tspan fill="#f59e0b" font-size="7"> ₴</tspan>`:'';
      rows+=`<text x="${p.x+8}" y="${ay+9}" font-family="Geist Mono,monospace" font-size="9" fill="${a.pii?'rgba(248,113,113,.8)':a.mon?'rgba(245,158,11,.7)':'rgba(144,144,170,.75)'}" opacity="${op}">${a.n}${piiMark}${monMark}<tspan fill="rgba(80,80,120,.6)" font-size="8"> : ${a.t}</tspan></text>`;
    });
    erdOverlay=`
      <rect x="${p.x}" y="${p.y+NH}" width="${NW}" height="${erdH}" rx="0" fill="rgba(8,8,18,.9)" stroke="${strokeC}" stroke-width="${strokeW*.7}" stroke-top="none" opacity="${op}"/>
      <line x1="${p.x}" y1="${p.y+NH}" x2="${p.x+NW}" y2="${p.y+NH}" stroke="rgba(167,139,250,.3)" stroke-width="1" opacity="${op}"/>
      ${rows}`;
  }

  return `<g data-id="${n.id}" style="cursor:pointer" onmouseenter="onHov(event,'${n.id}')" onmouseleave="offHov()" onclick="selectN('${n.id}')">
    <path d="${shapePath}" fill="${fill}" stroke="${strokeC}" stroke-width="${strokeW}" ${strokeDash} ${filt} opacity="${op}"/>
    ${erdOverlay}
    ${stripe}${sdot}
    <text x="${typeX}" y="${p.y+15}" font-family="Geist Mono,monospace" font-size="8" fill="${tc}" font-weight="600" letter-spacing=".05em" opacity="${op}">${TA[n.type]}</text>
    <text x="${typeX+16}" y="${p.y+15}" font-family="Geist,sans-serif" font-size="11" fill="${isSel||isTrc?'#e8e8f0':'#c0c0d8'}" font-weight="${isSel?'600':'400'}" opacity="${op}">${nm}</text>
    <rect x="${p.x+8}" y="${p.y+NH-27}" width="${NW-16}" height="2" rx="1" fill="rgba(30,30,42,.8)" opacity="${op}"/>
    <rect x="${p.x+8}" y="${p.y+NH-27}" width="${covW}" height="2" rx="1" fill="${cc2}" opacity="${op*.9}"/>
    <text x="${p.x+8}" y="${p.y+NH-30}" font-family="Geist Mono,monospace" font-size="7.5" fill="${cc2}" opacity="${op*.85}">${n.cov}%</text>
    ${req1}${badges}${ring}
  </g>`;
}

// ─── HOVER CARD ─────────────────────────────────────────────────────────────
function onHov(evt,id){
  if(hovT)clearTimeout(hovT);
  const n=N[id];if(!n)return;
  const card=document.getElementById('hcard');
  const tc=TC[n.type];
  const cc=!n.reqs.length?'#1e1e2a':n.gap?'#f59e0b':'#2dd4bf';
  const hc=n.cov>=80?'#2dd4bf':n.cov>=50?'#f59e0b':'#f87171';
  const reqPills=n.reqs.map(r=>`<span class="hc-req ${n.gap&&r?'gap':'ok'}">${r}</span>`).join('');
  const infraFlags=[
    n.pt&&'paper_trail',n.arch&&'archival',n.oban.length&&`oban:${n.oban[0]}`,
    n.sm.on&&`fsm(${n.sm.states.length})`,n.rl&&'rate-limited',n.pm&&'migr⚠'
  ].filter(Boolean).map(f=>`<span style="font-family:var(--mono);font-size:8px;padding:1px 4px;border-radius:2px;background:var(--s3);color:var(--t2);border:1px solid var(--b2)">${f}</span>`).join(' ');

  let extraRows='';
  if(lens==='sen'){
    // sensitive lens: show PII field breakdown
    if(n.attrs.length){
      const pii=n.attrs.filter(a=>a.pii||a.sen);
      extraRows=`<div class="hc-div"></div><div class="hc-row"><span class="hc-k">PII fields</span><span class="hc-v" style="color:var(--rd)">${pii.length}/${n.attrs.length}</span></div>`;
      if(pii.length)extraRows+=pii.map(a=>`<div class="hc-row"><span class="hc-k" style="padding-left:8px">${a.n}</span><span style="font-size:8px;color:var(--rd)">PII</span></div>`).join('');
    }
    const mon=n.money&&n.money.length?`<div class="hc-row"><span class="hc-k">monetary</span><span class="hc-v" style="color:var(--yw)">${n.money.length} field${n.money.length!==1?'s':''}</span></div>`:'';
    const pt=`<div class="hc-row"><span class="hc-k">paper_trail</span><span class="hc-v ${n.pt?'ok':'warn'}">${n.pt?'✓ yes':'✗ no'}</span></div>`;
    extraRows+=`<div class="hc-div"></div>${mon}${pt}`;
  } else if(lens==='hlth'){
    // health lens: show property/scenario/e2e matrix
    const mk=(v,l)=>`<div class="hc-row"><span class="hc-k">${l}</span><span class="hc-v ${v?'ok':'warn'}">${v?'✓':'✗'}</span></div>`;
    extraRows=`<div class="hc-div"></div>${mk(n.tests.p,'property')}${mk(n.tests.s,'scenario')}${mk(n.tests.e,'e2e')}`;
  } else if(lens==='erd'){
    // ERD lens: show all fields
    if(n.attrs.length){
      extraRows=`<div class="hc-div"></div>`+n.attrs.slice(0,5).map(a=>`<div class="hc-row"><span class="hc-k">${a.n}</span><span class="hc-v" style="color:var(--pu)">${a.t}</span>${a.pii?`<span style="font-size:7px;color:var(--rd);margin-left:2px">PII</span>`:''}${a.mon?`<span style="font-size:7px;color:var(--yw);margin-left:2px">₴</span>`:''}</div>`).join('');
      if(n.attrs.length>5)extraRows+=`<div style="font-size:9px;color:var(--t3);padding:2px 0">+${n.attrs.length-5} more…</div>`;
    }
  } else if(lens==='imp'){
    // impact lens: show connections
    const out=EDGES.filter(e=>e.f===n.id).map(e=>N[e.t]?.name||e.t);
    const inp=EDGES.filter(e=>e.t===n.id).map(e=>N[e.f]?.name||e.f);
    if(out.length||inp.length){
      extraRows=`<div class="hc-div"></div>`;
      if(inp.length)extraRows+=`<div class="hc-row"><span class="hc-k">receives from</span><span class="hc-v" style="color:var(--bl);flex:1;text-align:right">${inp.join(', ')}</span></div>`;
      if(out.length)extraRows+=`<div class="hc-row"><span class="hc-k">sends to</span><span class="hc-v" style="color:var(--gn);flex:1;text-align:right">${out.join(', ')}</span></div>`;
    }
  } else if(n.type==='resource'&&n.attrs.length){
    const top=n.attrs.slice(0,3);
    extraRows=`<div class="hc-div"></div>`+top.map(a=>`<div class="hc-row"><span class="hc-k">${a.n}</span><span class="hc-v" style="color:var(--bl)">${a.t}</span>${a.sen?`<span style="font-size:7px;color:var(--rd);margin-left:4px">PII</span>`:''}</div>`).join('');
  } else if(n.type==='transfer'||n.type==='reactor'){
    extraRows=`<div class="hc-div"></div><div class="hc-row"><span class="hc-k">steps</span><span class="hc-v ac">${n.actions.length} actions</span></div>`;
  } else if(n.type==='rule'){
    extraRows=`<div class="hc-div"></div><div class="hc-row"><span class="hc-k">enforces</span><span class="hc-v" style="color:var(--yw)">${n.reqs.length} req${n.reqs.length!==1?'s':''}</span></div>`;
  }

  card.innerHTML=`
    <div class="hc-head">
      <span style="font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:3px;background:${tc}22;color:${tc};border:1px solid ${tc}44">${n.type.toUpperCase()}</span>
      <span class="hc-name">${n.name}</span>
      ${n.sensitive?`<span style="font-size:9px;color:var(--rd)">sensitive</span>`:''}
    </div>
    <div class="hc-rows">
      <div class="hc-row"><span class="hc-k">domain</span><span class="hc-v ac">${n.domain}</span></div>
      <div class="hc-row"><span class="hc-k">coverage</span>
        <div class="hc-cbar"><div class="hc-cbg"><div class="hc-cfill" style="width:${n.cov}%;background:${hc}"></div></div>
        <span class="hc-v" style="color:${hc}">${n.cov}%</span></div>
      </div>
      <div class="hc-row"><span class="hc-k">compliance</span><span class="hc-v ${n.gap?'warn':'ok'}">${n.gap?'gap':'covered'}</span></div>
      ${extraRows}
      ${reqPills?`<div class="hc-div"></div><div class="hc-row"><span class="hc-k">reqs</span><span style="flex:1">${reqPills}</span></div>`:''}
      ${infraFlags?`<div class="hc-div"></div><div style="display:flex;flex-wrap:wrap;gap:3px">${infraFlags}</div>`:''}
    </div>
  `;

  const canv=document.getElementById('canv');
  const cr=canv.getBoundingClientRect();
  let cx=evt.clientX-cr.left+14,cy=evt.clientY-cr.top-10;
  if(cx+270>cr.width)cx=evt.clientX-cr.left-274;
  if(cy+220>cr.height)cy=cr.height-225;
  card.style.left=cx+'px';card.style.top=cy+'px';card.style.display='block';
}
function offHov(){hovT=setTimeout(()=>{const c=document.getElementById('hcard');if(c)c.style.display='none';},80);}

  if(l==='imp'){
    impNode=sel;
    impSet=new Set();

      EDGES.forEach(e=>{

// ─── SCENARIO TRACE ──────────────────────────────────────────────────────────
function pickScenario(val){
  traceId=val||null;traceSet=new Set();traceGaps=new Set();
  const pathEl=document.getElementById('tpath');
  const infoEl=document.getElementById('tinfo');
  if(!val){pathEl.innerHTML='<span style="color:var(--t4);font-size:10px">Select a scenario above</span>';infoEl.textContent='';renderG();renderSb();return;}
  const sc=SCENARIOS[val];if(!sc)return;
  sc.steps.forEach(s=>{traceSet.add(s.id);if(s.gap)traceGaps.add(s.id);});
  const nodes=sc.steps.map(s=>`<span class="tnode ${traceGaps.has(s.id)?'gap':''}" onclick="selectN('${s.id}')">${N[s.id]?.name||s.id}</span>`);
  pathEl.innerHTML=nodes.join('<span class="tarr">→</span>');
  const gaps=sc.steps.filter(s=>s.gap).length;
  infoEl.textContent=`${sc.steps.length} steps · ${gaps} gap${gaps!==1?'s':''}`;
  renderG();renderSb();
  // show drawer with scenario flow
  showScenarioDrawer(val);
}

function clearTrace(){
  const sel2=document.getElementById('tscsel');if(sel2)sel2.value='';
  if(sel2)sel2.style.display='';
  pickScenario('');
  document.getElementById('tracebar').classList.remove('on');
  impNode=null;impSet=new Set();
  lens='str';
  document.querySelectorAll('.lb').forEach(b=>b.classList.remove('active'));
  document.getElementById('l-str').classList.add('active');
  updateLegend();renderG();
}

// ─── NODE SELECT ─────────────────────────────────────────────────────────────
function selectN(id){
  sel=id;
  // if in impact lens, pivot the impact analysis to this node
  if(lens==='imp'){
    impNode=id;
    impSet=new Set();
    EDGES.forEach(e=>{
      if(e.f===id)impSet.add(e.t);
      if(e.t===id)impSet.add(e.f);
    });
    document.getElementById('tpath').innerHTML=`Impact of <strong style="color:var(--bl)">${N[id]?.name||id}</strong> — <span style="color:var(--t2)">${impSet.size} connected module${impSet.size!==1?'s':''}</span>. Click any module to pivot.`;
  }
  renderSb();renderG();
  const n=N[id];if(!n)return;
  openDrawer(n);
}

function openDrawer(n){
  document.getElementById('drawer').classList.add('open');
  switchDTab(dtab,n);
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  sel=null;renderSb();renderG();
}

function switchDTab(tab,nodeOrEv){
  dtab=tab;
  document.querySelectorAll('.dtab').forEach(t=>t.classList.remove('active'));
  document.getElementById('dt-'+tab)?.classList.add('active');
  const n=N[sel];if(!n)return;
  renderDContent(n,tab);
}

function renderDContent(n,tab){
  const dc=document.getElementById('dcontent');
  const cta=document.getElementById('dcta');
  if(tab==='details') renderDetails(n,dc,cta);
  else if(tab==='flow') renderFlow(n,dc,cta);
  else if(tab==='shortcuts') renderShortcuts(n,dc,cta);
}

function renderDetails(n,dc,cta){
  const tc=TC[n.type];
  const hc=n.cov>=80?'var(--gn)':n.cov>=50?'var(--yw)':'var(--rd)';
  const cw=Math.round(n.cov/100*100);
  const infoCells=[
    {k:'paper_trail',v:n.pt?'✓ yes':'— no',cls:n.pt?'iv-ok':'iv-no'},
    {k:'archival',v:n.arch?'✓ yes':'— no',cls:n.arch?'iv-ok':'iv-no'},
    {k:'rate_limited',v:n.rl?'⚠ yes':'— no',cls:n.rl?'iv-w':'iv-no'},
    {k:'auth subject',v:n.auth?'✓ yes':'— no',cls:n.auth?'iv-ok':'iv-no'},
    {k:'migrations',v:n.pm?'⚠ pending':'— clear',cls:n.pm?'iv-w':'iv-no'},
    {k:'data_layer',v:n.dl||'—',cls:'iv-bl'},
  ];
  let html=`
    <div class="ds">
      <div class="d-mod">${n.module}</div>
      <div class="d-name">${n.name}</div>
      <div class="d-desc">${n.desc}</div>
      <div class="d-tags">
        <span class="tag t-dom">${n.domain}</span>
        <span class="tag t-n">${n.type}</span>
        ${n.sensitive?`<span class="tag t-sen">sensitive</span>`:''}
        ${n.gap?`<span class="tag t-gap">compliance gap</span>`:`<span class="tag t-ok">covered</span>`}
        ${n.auth?`<span class="tag t-n">auth-subject</span>`:''}
      </div>
      <div class="d-meta">
        <div class="d-mpill">📅 <span>${n.mod}</span></div>
        ${n.oban.length?`<div class="d-mpill">⚡ <span>oban:${n.oban[0]}</span></div>`:''}
        ${n.sm.on?`<div class="d-mpill">⟳ <span>fsm(${n.sm.states.length})</span></div>`:''}
      </div>
    </div>`;

  // test coverage
  html+=`<div class="ds">
    <div class="ds-lbl">Test Coverage</div>
    <div class="covwrap">
      <div class="covrow">
        <span class="covlbl">Overall</span>
        <div class="covbg"><div class="covfill" style="width:${cw}%;background:${hc}"></div></div>

        <div class="tc"><div class="tc-ic">${n.tests.s?'<span style="color:var(--gn)">✓</span>':'<span style="color:var(--rd)">✗</span>'}</div><div class="tc-lb">Scenario</div></div>
        <div class="tc"><div class="tc-ic">${n.tests.e?'<span style="color:var(--gn)">✓</span>':'<span style="color:var(--rd)">✗</span>'}</div><div class="tc-lb">E2E</div></div>
      </div>
    </div>
  </div>`;

  // attributes
  if(n.attrs&&n.attrs.length){
    const rows=n.attrs.map(a=>`<tr>
      <td><span class="aname">${a.n}</span>${a.pii?`<span class="aflag f-pii">PII</span>`:''}${a.mon?`<span class="aflag f-mon">₴</span>`:''}</td>
      <td><span class="atype">${escH(a.t)}</span></td>

    html+=`<div class="ds"><div class="ds-lbl">Attributes <span class="ds-cnt">${n.attrs.length}</span></div><table class="atbl">${rows}</table></div>`;
  }

  // actions
  if(n.actions&&n.actions.length){
    const rows=n.actions.map(a=>`<div class="arow"><span class="aname2">${a.n}</span><span class="cbadge c-${a.c.substring(0,3)}">:${a.c}</span></div>`).join('');
    html+=`<div class="ds"><div class="ds-lbl">Actions <span class="ds-cnt">${n.actions.length}</span></div>${rows}</div>`;
  }

  // compliance reqs
  if(n.reqs&&n.reqs.length){
    const items=n.reqs.map(r=>{
      const meta=RMETA[r]||{label:'—'};
      const isGap=n.gap;
      return `<div class="ritem" onclick="showToast('${r}: ${meta.label}')">
        <span class="rid">${r}</span><span class="rlbl">${meta.label}</span>
        <span class="rchip ${isGap?'rc-gap':'rc-ok'}">${isGap?'GAP':'ok'}</span>
      </div>`;
    }).join('');
    html+=`<div class="ds"><div class="ds-lbl">Compliance Requirements <span class="ds-cnt">${n.reqs.length}</span></div>${items}</div>`;
  }

  // state machine
  if(n.sm&&n.sm.on){
    const states=n.sm.states.map(s=>`<span class="smst">${s}</span>`).join(' ');
    const trans=n.sm.tr.map(t=>`<div class="smtr"><span>${t.f}</span><span class="smarr">→</span><span style="color:var(--gn)">${t.t}</span><span style="color:var(--t3);margin-left:auto;font-family:var(--mono);font-size:9px">${t.ev}</span></div>`).join('');
    html+=`<div class="ds"><div class="ds-lbl">State Machine</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">${states}</div>${trans}</div>`;
  }

  // infrastructure
  html+=`<div class="ds"><div class="ds-lbl">Infrastructure</div>
    <div class="igrid">${infoCells.map(c=>`<div class="icell"><span class="ikey">${c.k}</span><span class="iv ${c.cls}">${c.v}</span></div>`).join('')}</div>
  </div>`;

  // telemetry
  if(n.telem&&n.telem.length){
    const parts=n.telem.map(p=>`<span class="tp">${p}</span>`).join(`<span class="tsep">.</span>`);
    html+=`<div class="ds"><div class="ds-lbl">Telemetry</div><div class="telem">${parts}</div></div>`;
  }

  // money
  if(n.money&&n.money.length){
    const rows=n.money.map(m=>`<div class="mrow"><span class="mn">${m.n}</span><span class="mtyp">${m.t}</span><span class="mcldr">${m.cldr}</span></div>`).join('');
    html+=`<div class="ds"><div class="ds-lbl">Money Attributes</div>${rows}</div>`;
  }

  // routes
  if(n.routes&&n.routes.length){
    const rows=n.routes.map(r=>`<div style="font-family:var(--mono);font-size:10px;padding:3px 0;display:flex;gap:8px;border-bottom:1px solid var(--b1);color:var(--t2)"><span style="color:var(--bl)">${r.m}</span><span style="flex:1">${r.r}</span><span style="color:${r.auth?'var(--gn)':'var(--rd)'}">${r.auth?'auth':'open'}</span></div>`).join('');
    html+=`<div class="ds"><div class="ds-lbl">API Routes</div>${rows}</div>`;
  }

  // feature flags
  if(n.flags&&n.flags.length){
    const rows=n.flags.map(f=>`<div style="font-family:var(--mono);font-size:10px;padding:3px 0;display:flex;gap:8px;border-bottom:1px solid var(--b1);color:var(--t2)"><span style="color:var(--yw);flex:1">${f.n}</span><span style="color:var(--ac2)">${f.adr||''}</span></div>`).join('');
    html+=`<div class="ds"><div class="ds-lbl">Feature Flags</div>${rows}</div>`;
  }

  // ADRs
  if(n.adrs&&n.adrs.length){
    html+=`<div class="ds"><div class="ds-lbl">Linked ADRs</div><div style="display:flex;flex-wrap:wrap;gap:4px">${n.adrs.map(a=>`<span class="tag t-dom" style="cursor:pointer" onclick="showToast('Opening ${a}…')">${a}</span>`).join('')}</div></div>`;
  }
  if(n.runbook){
    html+=`<div class="ds"><div class="ds-lbl">Runbook</div><div style="font-size:11px;color:var(--bl);cursor:pointer" onclick="showToast('Opening runbook…')">📖 ${n.runbook}</div></div>`;
  }

  dc.innerHTML=html;

  // CTA
  if(n.gap){
    cta.className='dcta on';
    cta.innerHTML=`<button class="btn-p" onclick="openBs('${n.id}')">⚡ Generate compliance test</button><button class="btn-g" onclick="showToast('Compliance matrix')">View compliance matrix →</button>`;
  } else {
    cta.className='dcta on';
    cta.innerHTML=`<button class="btn-g" onclick="openBs('${n.id}')">Propose change to ${n.name}</button>`;
  }
}

function renderFlow(n,dc,cta){
  // find scenarios involving this node
  const relevant=Object.entries(SCENARIOS).filter(([,sc])=>sc.steps.some(s=>s.id===n.id));
  let html=`<div class="ds"><div class="flow-intro">Scenarios that involve <strong style="color:var(--tx)">${n.name}</strong>. Click a step to highlight it on the canvas.</div>`;
  if(!relevant.length){html+=`<div style="font-size:11px;color:var(--t3)">No scenarios defined for this module.</div></div>`;dc.innerHTML=html;cta.className='dcta';return;}
  relevant.forEach(([sid,sc])=>{
    html+=`<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:600;color:var(--t2);margin-bottom:5px">${sc.label}</div>`;
    sc.steps.forEach((step,i)=>{
      const isThis=step.id===n.id;
      const stepN=N[step.id];
      const actCls=isThis?'act':'';const numCls=isThis?'act':'';
      html+=`<div class="fstep ${actCls}" onclick="selectN('${step.id}')">

        <div class="fsbody">
          <div class="fstitle">${stepN?.name||step.id}<span class="fst ${step.gap?'fst-gap':'fst-ok'}">${step.gap?'gap':'ok'}</span></div>

function filterPal(q){
  const f=q.toLowerCase();
  const matches=PAL_ITEMS.filter(i=>i.label.toLowerCase().includes(f)).slice(0,14);
  const body=document.getElementById('palbody');
  if(!matches.length){body.innerHTML='<div class="palempty">No results</div>';return;}
  const grouped={module:[],req:[],adr:[]};
  matches.forEach(i=>(grouped[i.type]||[]).push(i));
  const labelMap={module:'Modules',req:'Requirements',adr:'ADRs'};
  let html='';
  ['module','req','adr'].forEach(t=>{
    if(!grouped[t].length)return;
    html+=`<div class="palsec"><div class="palsec-lbl">${labelMap[t]}</div>`;
    grouped[t].slice(0,6).forEach(i=>{
      html+=`<div class="palitem" onclick="(${i.action.toString()})()">
        <div class="palicon pi-${t==='module'?{resource:'res',transfer:'tr',rule:'ru',reactor:'re'}[Object.values(N).find(n=>n.name===i.label)?.type]||'doc':'doc'}" style="color:${i.col}">${i.icon}</div>
        <span class="pallbl">${i.label}</span><span class="palmeta">${i.type}</span>
      </div>`;
    });
    html+=`</div>`;
  });
  body.innerHTML=html;
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ─── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  renderSb();renderG();renderFeed();updateLegend();
});
window.addEventListener('resize',()=>renderG());
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openPal();}
  if(e.key==='Escape'){closePal();closeBs();}
});
// palback click-outside
document.getElementById('palback')?.addEventListener('click',e=>{if(e.target===document.getElementById('palback'))closePal();});
</script>
