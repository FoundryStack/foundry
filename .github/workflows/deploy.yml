name: Build and Deploy

on:
  push:
    branches: [master, main]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -a --volumes -f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/maxsvargal/foundry:latest
            ghcr.io/maxsvargal/foundry:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      DEPLOY_HOST: 178.128.17.11
      DEPLOY_TARGET: deploy@178.128.17.11
      DEPLOY_PATH: /opt/saas_panel
      STUDIO_CONTAINER: saas_foundry
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Free up disk space on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.DEPLOY_TARGET }} \
            "docker image prune -a --force --filter 'until=24h' && \
             docker container prune --force && \
             docker builder prune --force"

      - name: Pull and restart foundry service
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.DEPLOY_TARGET }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose pull foundry && \
             docker compose up -d foundry"

      - name: Restart saas_panel to redeploy studio container
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.DEPLOY_TARGET }} \
            "docker pull ghcr.io/maxsvargal/foundry:latest && \
             docker rm -f foundry-studio 2>/dev/null || true && \
             cd ${{ env.DEPLOY_PATH }} && \
             docker compose restart app"

      - name: Verify health
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.DEPLOY_TARGET }} \
            "sleep 10 && for i in \$(seq 1 25); do docker exec ${{ env.STUDIO_CONTAINER }} curl -sf http://localhost:4000/healthz && echo 'Studio healthy' && exit 0; sleep 3; done; echo 'Studio health check timed out'; exit 1"
          ssh -i ~/.ssh/id_ed25519 ${{ env.DEPLOY_TARGET }} \
            "for i in \$(seq 1 30); do curl -sf http://localhost:4000/healthz && echo 'Panel healthy' && exit 0; sleep 3; done; echo 'Panel health check timed out'; exit 1"
