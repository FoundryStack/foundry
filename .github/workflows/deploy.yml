name: Build and Deploy

on:
  push:
    branches: [master, main]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/maxsvargal/foundry:latest
            ghcr.io/maxsvargal/foundry:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.128.17.11 >> ~/.ssh/known_hosts

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@178.128.17.11 \
            "cd /opt/saas_panel && \
             docker compose pull foundry && \
             docker compose up -d foundry"

      - name: Verify health
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@178.128.17.11 \
            "for i in \$(seq 1 20); do curl -sf http://localhost:4001/healthz && echo 'Studio healthy' && exit 0; sleep 3; done; echo 'Health check timed out'; exit 1"
